name: CI

# Runs on pushes to the two branches in this repo, and on every PR into them.
# Feature branches are covered through their PR, which keeps runner minutes
# down without letting anything reach dev unverified.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push to the same branch cancels the previous run. Only the latest
# commit's result is meaningful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The most important check in this repository.
  #
  # The bootloader's entire security model rests on one private key. If that
  # key ever lands in git history, deleting the file does not fix it: anyone
  # who cloned the repo has it, and the only real remedy is generating a new
  # key, rebuilding the bootloader, reflashing over SWD, and re-signing every
  # image. Catching it at PR time is the one cheap moment.
  secrets:
    name: No key material committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fail if a key file is tracked
        run: |
          if git ls-files | grep -E '\.(pem|key|p8|pfx)$'; then
            echo "::error::A key file is tracked in git. Remove it and rotate the key."
            exit 1
          fi
          echo "No key files tracked."

      - name: Fail if a private key block is committed
        # Catches a key pasted into a script, doc, or test fixture, which the
        # extension check above would miss.
        run: |
          if git grep -I -l -E -- "-----BEGIN [A-Z ]*PRIVATE KEY-----"; then
            echo "::error::A private key block is committed. Rotate the key."
            exit 1
          fi
          echo "No private key blocks found."

  # Formatting is checked rather than applied, so the diff a reviewer sees is
  # only the change itself, never a reformatting of untouched lines.
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        # Passes cleanly when no sources exist yet, so this job is green from
        # the first commit and starts doing real work as soon as code lands.
        run: |
          files=$(find common bootloader app transports tests \
                    \( -name '*.c' -o -name '*.h' \) 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "No C sources yet; nothing to check."
            exit 0
          fi
          echo "$files" | xargs clang-format --dry-run --Werror
